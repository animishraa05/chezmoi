# =============================================================================
# 🐈 Kitty Configuration
# =============================================================================
# Inspired by Catppuccin, Wezterm defaults, and popular setups.

# ==============================
# 🐚 SHELL & SYSTEM
# ==============================
shell /usr/bin/fish
shell_integration enabled
linux_display_server auto
wayland_titlebar_color background

# ==============================
# 🔤 FONT
# ==============================
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        19.0
disable_ligatures never
adjust_line_height 1
undercurl_style thin-sparse

# ==============================
# 🎨 APPEARANCE & WINDOW
# ==============================
background_opacity 0.85
dynamic_background_opacity yes
background_blur 1
draw_minimal_borders yes
hide_window_decorations yes
window_padding_width 20
window_margin_width 0
remember_window_size yes
initial_window_width 1200
initial_window_height 800
sync_to_monitor no
confirm_os_window_close 0
visual_bell_duration 0.25
visual_bell_color #cba6f7
enable_audio_bell no

# Window borders (for split visibility)
active_border_color   #cba6f7
inactive_border_color #1e1e2e

# ==============================
# 🖱️ CURSOR
# ==============================
cursor_shape block
cursor_blink_interval -1
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ==============================
# 📋 CLIPBOARD & MOUSE
# ==============================
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
copy_on_select yes
mouse_hide_wait 3.0

# ==============================
# 🖱️ SCROLL / BUFFER
# ==============================
scrollback_lines 20000
wheel_scroll_multiplier 5.0

# ==============================
# 🔗 URL DETECTION
# ==============================
url_style        curly
open_url_with    default
detect_urls      yes
url_prefixes     http https file ftp gemini irc gopher mailto news git
underline_hyperlinks hover

# ==============================
# 📐 LAYOUTS
# ==============================
enabled_layouts splits,tall,grid,fat,horizontal,vertical

# ==============================
# 🗂️ TAB BAR
# ==============================
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_title_template       "{index}: {title}"
active_tab_font_style    bold-italic
inactive_tab_font_style  normal

# =============================================================================
# ⌨️ KEYBINDINGS (WEZTERM STYLE)
# =============================================================================
# In wezterm, user used `CTRL+SHIFT` for `mod.SUPER` on Linux.
# So we map kitty's native mappings to these where possible.
clear_all_shortcuts no

# -- Clipboard --
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# -- Scrolling --
map ctrl+shift+u scroll_line_up 5
map ctrl+shift+d scroll_line_down 5
map page_up scroll_page_up
map page_down scroll_page_down

# -- Window / Pane Splitting (like WezTerm) --
# V-split: ctrl+shift+\
map ctrl+shift+\ launch --location=vsplit --cwd=current
# H-split: wezterm had ctrl+\ for H-split, let's also map alt+shift+"
map ctrl+\ launch --location=hsplit --cwd=current
map alt+shift+" launch --location=hsplit --cwd=current
map alt+shift+% launch --location=vsplit --cwd=current

# Close pane: ctrl+shift+w
map ctrl+shift+w close_window

# Toggle Zoom: ctrl+shift+enter
map ctrl+shift+enter toggle_layout stack

# Spawn Window: ctrl+shift+n
map ctrl+shift+n new_os_window

# -- Pane Navigation (Wezterm: alt+hjkl or ctrl+shift+hjkl) --
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# -- Pane Resizing (Wezterm: leader+p -> hjkl, in kitty we can just do alt+shift+hjkl) --
map alt+shift+h resize_window narrower
map alt+shift+j resize_window shorter
map alt+shift+k resize_window taller
map alt+shift+l resize_window wider

# -- Tab Management --
map alt+shift+t new_tab_with_cwd
map alt+w close_tab
map alt+[ previous_tab
map alt+] next_tab
map alt+shift+{ move_tab_backward
map alt+shift+} move_tab_forward

# Alt+1..9 to go to tabs
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# -- Font Resizing --
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# -- Reload Config --
map f5 load_config_file

