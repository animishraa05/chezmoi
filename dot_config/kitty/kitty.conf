# =============================================================================
# 🚀 SPEED & WORKFLOW
# =============================================================================
# -- Migrated from Alacritty --
map ctrl+shift+space show_scrollback
map ctrl+shift+k clear_terminal scrollback active

# -- FZF integration for Scrollback --
# Press ctrl+shift+f to search your entire terminal history instantly with FZF!
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fish -c "fzf --no-sort --no-mouse --exact -i --tac | kitty +kitten clipboard"

# -- Kitten Hints (for speed!) --
# Quickly select paths, hashes, or URLs visible on screen without touching the mouse:
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>n kitten hints --type path --program "launch --type=overlay nvim"
map ctrl+shift+p>h kitten hints --type hash --program -
