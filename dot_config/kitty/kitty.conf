inactive_border_color   #1c1c24
bell_border_color       #f3be7c

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #141415
active_tab_background   #7e98e8
inactive_tab_foreground #cdcdcd
inactive_tab_background #1c1c24
tab_bar_background      #1c1c24

mark1_foreground #141415
mark1_background #7e98e8
mark2_foreground #141415
mark2_background #bb9dbd
mark3_foreground #141415
mark3_background #6a9589

