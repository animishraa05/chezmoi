;==========================================================
;           MODULES - Clean Vague.nvim Edition
;==========================================================

[module/rofi]
type = custom/text
format = "%{T3}%{T-}"
format-foreground = ${colors.blue}
format-padding = 6px
click-left = rofi -show drun -config "/home/ani/.config/rofi/main_menu.rasi" &
click-right = /home/ani/.config/rofi/power_menu.sh &

;==========================================================

[module/i3]
type = internal/i3
enable-scroll = false
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true

ws-icon-0 = 1;%{T4} %{T-}
ws-icon-1 = 2;%{T4} %{T-}
ws-icon-2 = 3;%{T4} %{T-}
ws-icon-3 = 4;%{T4}   %{T-}
ws-icon-4 = 5;%{T4}   %{T-}
ws-icon-5 = 6;%{T4}   %{T-}
ws-icon-6 = 7;%{T4}   %{T-}
ws-icon-7 = 8;%{T4}   %{T-}
ws-icon-default = %{T4}   %{T-}
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.red}
label-mode-margin = 8px

; Tighter padding so all workspace icons are fully visible
label-focused = %icon%
label-focused-foreground = ${colors.blue}
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.blue}
label-focused-padding = 4px

label-unfocused = %icon%
label-unfocused-foreground = ${colors.fg-alt}
label-unfocused-padding = 4px

label-visible = %icon%
label-visible-foreground = ${colors.cyan}
label-visible-underline = ${colors.cyan}
label-visible-padding = 4px

label-urgent = %icon%
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 3px

;==========================================================

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/music.sh
tail = true
format = <label>
format-padding = 6px
label = %output%
click-right = kitty -e ncspot &
click-middle = spotify-launcher &
scroll-up = playerctl --player=spotify,ncspot,%any volume 0.05+
scroll-down = playerctl --player=spotify,ncspot,%any volume 0.05-

;==========================================================

[module/whitenoise]
type = custom/script
exec = if [ -f /tmp/whitenoise.state ]; then state=$(cat /tmp/whitenoise.state); if [ "$state" = "playing" ]; then echo "%{T2}󰈉%{T-}"; elif [ "$state" = "paused" ]; then echo "%{T2}󰐊%{T-}"; else echo "%{T2}󰸩%{T-}"; fi; else echo "%{T2}󰸩%{T-}"; fi
interval = 2
format = <label>
format-padding = 4px
label = %output%
label-foreground = ${colors.cyan}
click-left = ~/.config/i3/scripts/whitenoise.sh &

;==========================================================

[module/article]
type = custom/script
exec = ~/.config/article-pipeline/scripts/polybar_module.sh
interval = 60
format = <label>
format-padding = 4px
label = %output%
label-maxlen = 18
label-foreground = ${colors.fg}
click-left  = ~/.config/article-pipeline/scripts/open_article.sh --rofi &
click-right = ~/.config/article-pipeline/scripts/open_article.sh --browser &
scroll-up   = ~/.config/article-pipeline/scripts/open_article.sh &
hook-0 = ~/.config/article-pipeline/scripts/polybar_module.sh

;==========================================================

[module/time]
type = internal/date
interval = 1
date = %a, %d %b
time = %I:%M %p
format = <label>
format-prefix = "󰥔 "
format-prefix-font = 2
format-prefix-foreground = ${colors.blue}
format-underline = ${colors.blue}
format-padding = 6px
label = %date%  •  %time%
label-foreground = ${colors.fg}

;==========================================================

[module/pomodoro]
type = custom/script
exec = /home/ani/.config/polybar/scripts/pomodoro.sh
interval = 1
format = <label>
format-background = ${colors.bg-alt}
format-padding = 6px
label = %output%
label-foreground = ${colors.orange}
click-left = /home/ani/.config/polybar/scripts/pomodoro.sh toggle &
click-right = /home/ani/.config/polybar/scripts/rofi_pomodoro.sh &

;==========================================================

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 " 
format-prefix-font = 2
format-prefix-foreground = ${colors.blue}
format-padding = 3px
label = %percentage%%
label-foreground = ${colors.fg}

;==========================================================

[module/temp]
type = internal/temperature
interval = 3
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon4/temp1_input
base-temperature = 20
warn-temperature = 75
units = true

format = <label>
format-prefix = "󰔏 "
format-prefix-font = 2
format-prefix-foreground = ${colors.orange}
format-padding = 3px
label = %temperature-c%
label-foreground = ${colors.fg}

format-warn = <label-warn>
format-warn-prefix = "󰸁 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${colors.red}
format-warn-underline = ${colors.red}
format-warn-padding = 5px
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

;==========================================================

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = "󰍛 "
format-prefix-font = 2
format-prefix-foreground = ${colors.pink}
format-padding = 3px
label = %percentage_used%%
label-foreground = ${colors.fg}

;==========================================================

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-padding = 3px

format-muted = <label-muted>
format-muted-padding = 3px

label-volume = "%percentage%%"
label-volume-foreground = ${colors.fg}

label-muted = "%{T2}󰝟%{T-}  Muted"
label-muted-foreground = ${colors.red}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = ${colors.cyan}

click-right = pavucontrol &

;==========================================================

[module/wifi]
type = custom/script
; Strips _Batman suffix cleanly so "Airtel" displays with proper icon gap
exec = ssid=$(nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2); short=${ssid%%_*}; if [ -n "$ssid" ]; then echo "%{T2}%{F#7fa563}󰤨%{F-}%{T-}  ${short:0:10}"; else echo "%{T2}%{F#d8647e}󰤭%{F-}%{T-}  Off"; fi
interval = 10
format = <label>
format-padding = 3px
label = %output%
label-foreground = ${colors.fg}
click-left = /home/ani/.config/polybar/scripts/rofi_wifi_menu.sh &
click-right = kitty -e nmtui &

;==========================================================

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT0
adapter = AC
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-padding = 3px
label-charging = " %percentage%%"
label-charging-foreground = ${colors.fg}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 3px
label-discharging = "  %percentage%%"
label-discharging-foreground = ${colors.fg}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.green}
format-full-padding = 3px
label-full = %percentage%%
label-full-foreground = ${colors.fg}

format-low = <animation-low> <label-low>
format-low-underline = ${colors.red}
format-low-padding = 3px
label-low = "  %percentage%%"
label-low-foreground = ${colors.red}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.yellow}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-font = 2
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750

animation-low-0 = 󰂃
animation-low-1 = 󰁺
animation-low-font = 2
animation-low-foreground = ${colors.red}
animation-low-framerate = 500

;==========================================================

[module/system-updates]
type = custom/script
exec = ~/.config/polybar/scripts/system_updates.sh
interval = 3600
format = <label>
format-prefix = "󰏔"
format-prefix-font = 2
format-prefix-foreground = ${colors.yellow}
format-padding = 3px
; Strips any leading icon/exclamation mark from your script so only the number shows
label = %output%
label-foreground = ${colors.fg}

;==========================================================

[module/tray]
type = internal/tray
format = <tray>
format-padding = 4px
tray-spacing = 7px
tray-size = 70%
