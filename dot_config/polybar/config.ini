;==========================================================
;       POLYBAR CONFIG - Clean Vague.nvim Layout
;==========================================================

include-file = ~/.config/polybar/modules/aniii_colors.ini
include-file = ~/.config/polybar/modules/modules.ini

[bar/i3_bar]
bottom = true
width = 100%
height = 24pt
radius = 0
dpi = 100

background = ${colors.bg}
foreground = ${colors.fg}

border-size = 0pt
line-size = 2pt
fixed-center = true

; Tighter spacing so right modules hug right edge and center stays centered
padding-left = 5.5px
padding-right = 4px
module-margin = 4px
separator = ""

; Font 0 (T1): Text (10.5pt)
; Font 1 (T2): Module Icons (14.5pt - balanced with text)
; Font 2 (T3): Arch Logo (18pt)
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=10.5;2"
font-1 = "JetBrainsMono Nerd Font:size=18;4"
font-2 = "JetBrainsMono Nerd Font:size=18;4"

modules-left = rofi i3 music article  whitenoise system-updates 
modules-center = time pomodoro
modules-right = cpu temp memory pulseaudio battery wifi tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
