# Starship config - minimal & fast
command_timeout = 300

format = """
$directory\
$git_branch\
$git_status\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold white"

[git_branch]
format = " [$symbol$branch]($style)"
style = "bold black"
truncation_length = 12

[git_status]
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
staged = "●${count}"
modified = "✱${count}"
stashed = "⚑"
deleted = "✗${count}"
renamed = "➡${count}"
untracked = "?${count}"
ignore_submodules = true
format = " [\\($all_status$ahead_behind\\)]($style)"
style = "bold black"
disabled = false

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold black)"

