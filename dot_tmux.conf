# =============================================================================
# 🚀 Basic Settings & Performance
# =============================================================================
set -s escape-time 0          # Zero delay for Escape key (crucial for Neovim)
set -g focus-events on        # Allow Neovim to detect terminal focus (for autoread)
set-option -g default-shell /usr/bin/fish  # Set fish as default shell

# Modern TrueColor and Undercurl support for Kitty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Allow image passthrough for vellum.nvim and other image tools
set -g allow-passthrough on
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',xterm-kitty:RGB'

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Underline colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# =============================================================================
# 🪟 Pane & Window Navigation
# =============================================================================
# Intuitive Pane Splitting (opens in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching with Alt + number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi-mode for copying
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Window Management settings
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Sync Tmux window titles to OS window titles (Kitty)
set -g set-titles on
set -g set-titles-string "#W - Tmux"

# =============================================================================
# 🔌 Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless Neovim/Tmux pane switching

# Extras for productivity
set -g @plugin 'tmux-plugins/tmux-yank'      # yank text to system clipboard
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # highlights if prefix is active
set -g @plugin 'tmux-plugins/tmux-open'      # open highlighted files/URLs with $EDITOR/browser
set -g @plugin 'tmux-plugins/tmux-copycat'   # quick search in scrollback
set -g @plugin 'tmux-plugins/tmux-cpu'       # CPU usage for statusline
set -g @plugin 'vaaleyard/tmux-dotbar'

# =============================================================================
# 🛠️ Plugin Configuration
# =============================================================================
# Auto save + restore sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Gruvbox options (Note: you need a gruvbox plugin loaded for this to work, but keeping it as requested)
set -g @tmux-gruvbox 'dark'

# Kanagawa-inspired tmux-dotbar colors
set -g @tmux-dotbar-bg "#181616"           # primary.background
set -g @tmux-dotbar-fg "#8a9a7b"          # normal.green (muted, calm)
set -g @tmux-dotbar-fg-current "#c8c093"  # primary.foreground (bright, highlighted)
set -g @tmux-dotbar-fg-session "#938aa9"  # bright.magenta (soft and visible)
set -g @tmux-dotbar-fg-prefix "#c4746e"   # normal.red (attention, alert)
set -g @tmux-dotbar-right true

# =============================================================================
# 🖼️ Visual Layer — panes, borders, messages, modes
#    Status-bar options stay under dotbar control; this only fills the gaps
#    it leaves. Palette matches the @tmux-dotbar-* vars above.
# =============================================================================

# Panes: single hairline borders, dim when inactive, brighter when active
set -g pane-border-lines         single
set -g pane-border-style         "fg=#3a3a4d"      # near-bg, recedes
set -g pane-active-border-style  "fg=#7d9a7b"      # normal.green, alive
set -g pane-border-format        " #{pane_index}#{?window_zoomed_flag, ,}#{pane_current_command} "

# Copy / visual modes use the alert red so they pop against the calm bg
setw -g mode-style                 "bg=#c4746e,fg=#181616,bold"

# Clock (prefix+c mode) matches the active-bright accent
setw -g clock-mode-colour          "#c8c093"

# Status/message line: subtle, readable, doesn't shout
set -g message-style               "fg=#c8c093,bg=#181616"
set -g message-command-style       "fg=#c4746e,bg=#181616,bold"

# No distracting screen flash on activity/bell; silent (state still visible in bar)
set -g visual-activity             off
set -g visual-bell                 off
set -g visual-silence              off
setw -g monitor-activity           off
set -g bell-action                 none

# Cursor colour inside panes (visual-silence off keeps it from blinking)
set -g cursor-color                "#c8c093"

# =============================================================================
# 🚀 Initialize TPM
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# 📊 Status Bar — native overrides, applied AFTER dotbar so they win.
#    Same Kanagawa palette. No #(forks): everything is pure tmux format,
#    so status-interval stays cheap. Plugins untouched.
# =============================================================================

set -g status-position       bottom
set -g status-justify        absolute-centre
set -g status-style          "bg=#181616,fg=#8a9a7b"
set -g status-left-length    30
set -g status-right-length   30
set -g status-interval       5

# Left: keep dotbar's session pill (prefix color-swap, no fork) — just pin length.
# (dotbar already set it; re-asserting length only.)

# Center: inactive windows flat + dim WITH index (matches your M-1..9 binds).
# Active window is a solid cream pill — mirrors the session pill shape.
# SSH shows icon only (dotbar's #(sed|grep|cut) fork per refresh is dropped).
setw -g window-status-separator         " • "
setw -g window-status-style             "bg=#181616,fg=#8a9a7b"
setw -g window-status-format            " #I:#W#{?#{==:#{pane_current_command},ssh}, 󰌘,}"
setw -g window-status-current-style     "bg=#181616,fg=#c8c093"
setw -g window-status-current-format    "#[bg=#181616,fg=#c8c093]#[bg=#c8c093,fg=#181616,bold] #I:#W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{pane_current_command},ssh}, 󰌘,} #[bg=#181616,fg=#c8c093]"
setw -g window-status-activity-style    "bg=#c8c093,fg=#181616"
setw -g window-status-bell-style        "bg=#c4746e,fg=#181616,bold"

# Right: date (muted purple) + time (brighter). No cpu/mem forks.
set -g status-right          "#[bg=#181616,fg=#938aa9] %b %d #[fg=#8a9a7b]%H:%M "
