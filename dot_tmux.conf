# =============================================================================
# 🚀 Basic Settings & Performance
# =============================================================================
set -s escape-time 0          # Zero delay for Escape key (crucial for Neovim)
set -g focus-events on        # Allow Neovim to detect terminal focus (for autoread)

# Modern TrueColor and Undercurl support for Alacritty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Underline colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# =============================================================================
# 🪟 Pane & Window Navigation
# =============================================================================
# Intuitive Pane Splitting (opens in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window switching with Alt + number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vi-mode for copying
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Window Management settings
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Sync Tmux window titles to OS window titles (Alacritty)
set -g set-titles on
set -g set-titles-string "#W - Tmux"

# =============================================================================
# 🔌 Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless Neovim/Tmux pane switching

# Extras for productivity
set -g @plugin 'tmux-plugins/tmux-yank'      # yank text to system clipboard
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # highlights if prefix is active
set -g @plugin 'tmux-plugins/tmux-open'      # open highlighted files/URLs with $EDITOR/browser
set -g @plugin 'tmux-plugins/tmux-copycat'   # quick search in scrollback
set -g @plugin 'tmux-plugins/tmux-cpu'       # CPU usage for statusline
set -g @plugin 'vaaleyard/tmux-dotbar'

# =============================================================================
# 🛠️ Plugin Configuration
# =============================================================================
# Auto save + restore sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Gruvbox options (Note: you need a gruvbox plugin loaded for this to work, but keeping it as requested)
set -g @tmux-gruvbox 'dark'

# Kanagawa-inspired tmux-dotbar colors
set -g @tmux-dotbar-bg "#181616"           # primary.background
set -g @tmux-dotbar-fg "#8a9a7b"          # normal.green (muted, calm)
set -g @tmux-dotbar-fg-current "#c8c093"  # primary.foreground (bright, highlighted)
set -g @tmux-dotbar-fg-session "#938aa9"  # bright.magenta (soft and visible)
set -g @tmux-dotbar-fg-prefix "#c4746e"   # normal.red (attention, alert)
set -g @tmux-dotbar-right true

# =============================================================================
# 🚀 Initialize TPM
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
